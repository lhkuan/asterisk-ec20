name: Build Asterisk EC20 Image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.vars.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: true
      - name: Verify startup and module loading as deployment user
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '[general]\n[defaults]\n' > smoke-quectel.conf
          chmod 644 smoke-quectel.conf
          docker run -d --name smoke --network none --user 1000:1000 \
            -v "$PWD/smoke-quectel.conf:/etc/asterisk/quectel.conf:ro" "$IMAGE@$DIGEST"
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec smoke asterisk -rx 'core waitfullybooted'; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker exec smoke asterisk -rx 'module load chan_quectel.so'
          docker exec smoke asterisk -rx 'module show like chan_quectel.so' | tee module.txt
          grep -Eq 'chan_quectel.so.*Running' module.txt
          docker exec smoke asterisk -rx 'module show like chan_pjsip.so' | tee pjsip.txt
          grep -Eq 'chan_pjsip.so.*Running' pjsip.txt
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:sha-$GITHUB_SHA"
          docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
          docker buildx imagetools inspect "$tag" --raw > manifest.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)' manifest.json
          done
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker buildx imagetools create -t "$image:latest" -t "$image:22.11.0" "$tag"
          fi
          docker buildx imagetools inspect "$tag" | tee -a "$GITHUB_STEP_SUMMARY"
