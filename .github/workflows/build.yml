name: Build Asterisk EC20 Image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - name: Verify both published architectures and module loading
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)' manifest.json
            name="smoke-$arch"
            docker run -d --platform "linux/$arch" --name "$name" --network none "$IMAGE@$DIGEST"
            printf '[general]\n[defaults]\n' > smoke-quectel.conf
            docker cp smoke-quectel.conf "$name:/etc/asterisk/quectel.conf"
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec "$name" asterisk -rx 'core waitfullybooted'; then ready=true; break; fi
              sleep 2
            done
            if [ "$ready" != true ]; then docker logs "$name"; exit 1; fi
            docker exec "$name" asterisk -rx 'module load chan_quectel.so'
            docker exec "$name" asterisk -rx 'module show like chan_quectel.so' | tee "$name-module.txt"
            if ! grep -Eq 'chan_quectel.so.*Running' "$name-module.txt"; then docker logs "$name"; exit 1; fi
            docker rm -f "$name"
          done
      - name: Promote verified image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:22.11.0" "$IMAGE@$DIGEST"
          echo "Published $IMAGE@$DIGEST for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"
